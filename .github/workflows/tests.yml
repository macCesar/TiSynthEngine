name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Contract and documentation tests
        run: |
          node tests/api_contract_regression.js
          node tests/default_profile_regression.js
          node tests/physical_rate_regression.js
          node tests/physical_bypass_regression.js
          node tests/documentation_regression.js
          node --test tests/example_app_regression.js

      - name: Production Android output and start profiles
        run: |
          curl --fail --location https://dl.google.com/dl/android/maven2/com/google/oboe/oboe/1.11.0/oboe-1.11.0.aar --output "$RUNNER_TEMP/oboe.aar"
          unzip -q "$RUNNER_TEMP/oboe.aar" -d "$RUNNER_TEMP/oboe"
          python3 tests/run_start_profiles.py
          python3 tests/run_native_hosts.py --oboe-include "$RUNNER_TEMP/oboe/prefab/modules/oboe/include"

      - name: Shared DSP core tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/output_core_regression.c -lm -o "$RUNNER_TEMP/output_core"
          "$RUNNER_TEMP/output_core"
          cc -std=c99 -O2 -Wall -Wextra -Wpedantic -o "$RUNNER_TEMP/dsp_core" tests/dsp_core_regression.c -lm
          "$RUNNER_TEMP/dsp_core"
          cc -std=c11 -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/held_core" tests/held_core_regression.c -lm
          "$RUNNER_TEMP/held_core"
          cc -std=c99 -O2 -Wall -Wextra -Wpedantic -o "$RUNNER_TEMP/spatial" tests/spatial_regression.c -lm
          "$RUNNER_TEMP/spatial"

      - name: Native transport and effects tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/sequence_core_regression.c -lm -o "$RUNNER_TEMP/sequence"
          "$RUNNER_TEMP/sequence"
          for source in unified_sequence transport_core routing_core spatial_update multisequence_clock sequence_replacement; do
            cc -std=c11 -O2 -Wall -Wextra -Werror "tests/${source}_regression.c" -lm -o "$RUNNER_TEMP/$source"
            "$RUNNER_TEMP/$source"
          done
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/effects_core_regression.c -lm -o "$RUNNER_TEMP/effects"
          "$RUNNER_TEMP/effects"
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/modulation_core_regression.c -lm -o "$RUNNER_TEMP/modulation"
          "$RUNNER_TEMP/modulation"
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread tests/transport_concurrency_regression.cpp -o "$RUNNER_TEMP/transport-concurrency"
          "$RUNNER_TEMP/transport-concurrency"
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -DSYNTH_REPLACEMENT_PUBLICATION tests/transport_concurrency_regression.cpp -o "$RUNNER_TEMP/replacement-concurrency"
          "$RUNNER_TEMP/replacement-concurrency"

      - name: Shared statistics tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -include ./shared/synth_stats.h -x c -fsyntax-only /dev/null
          c++ -std=c++17 -O2 -Wall -Wextra -pthread tests/stats_regression.cpp -o "$RUNNER_TEMP/stats"
          "$RUNNER_TEMP/stats"
          python3 tests/run_stats_java.py
          python3 tests/run_studio_java.py

      - name: Java contracts and historical DSP model (not a production oracle)
        working-directory: android
        run: |
          test_dir=$(mktemp -d)
          javac -d "$test_dir" \
            src/ti/synthengine/SynthContract.java \
            src/ti/synthengine/SynthStudioContract.java \
            test/ti/synthengine/SynthContractRegression.java \
            test/ti/synthengine/SynthHeldContractRegression.java \
            test/ti/synthengine/SynthSpatialContractRegression.java \
            test/ti/synthengine/SynthUnifiedContractRegression.java \
            src/ti/synthengine/SynthDsp.java \
            test/ti/synthengine/SynthDspRegression.java
          java -cp "$test_dir" ti.synthengine.SynthContractRegression
          java -cp "$test_dir" ti.synthengine.SynthHeldContractRegression
          java -cp "$test_dir" ti.synthengine.SynthSpatialContractRegression
          java -cp "$test_dir" ti.synthengine.SynthUnifiedContractRegression
          java -cp "$test_dir" ti.synthengine.SynthDspRegression

  ios-contract-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Production Apple output and start profiles
        run: |
          python3 tests/run_master_sample_ios.py
          python3 tools/build_ios_render_host.py --output "$RUNNER_TEMP/apple-render"
          "$RUNNER_TEMP/apple-render" --output
          "$RUNNER_TEMP/apple-render" --metadata
          "$RUNNER_TEMP/apple-render"

      - name: Apple spatial state regression
        run: |
          clang -std=c99 -Os -Wall -Wextra -Wpedantic tests/spatial_regression.c -lm -o "$RUNNER_TEMP/apple-spatial"
          "$RUNNER_TEMP/apple-spatial"
      - name: Replay iOS contracts
        run: |
          clang -fobjc-arc -Wall -Wextra -framework Foundation tests/contract_corpus_ios.m ios/Classes/TiSynthengineContract.m -o "$RUNNER_TEMP/contracts"
          "$RUNNER_TEMP/contracts"
          clang -fobjc-arc -Wall -Wextra -framework Foundation tests/studio_corpus_ios.m ios/Classes/TiSynthengineContract.m -o "$RUNNER_TEMP/studio-corpus"
          "$RUNNER_TEMP/studio-corpus"
          clang -fobjc-arc -Wall -Wextra -framework Foundation tests/studio_contract_ios.m ios/Classes/TiSynthengineContract.m -o "$RUNNER_TEMP/studio-contract"
          "$RUNNER_TEMP/studio-contract"
          clang -fobjc-arc -Wall -Wextra -framework Foundation tests/unified_contract_ios.m ios/Classes/TiSynthengineContract.m -o "$RUNNER_TEMP/unified-contract"
          "$RUNNER_TEMP/unified-contract"
      - name: iOS event polling and metadata retirement
        run: python3 tests/run_sequence_events_ios.py
